image: docker:24

services:
  - docker:24-dind

stages:
  - build
  - test
  - docker_build
  - push
  - deploy

variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY


build_frontend:
  stage: build
  script:
    - echo "Frontend build skipped in docker runner"

build_backend:
  stage: build
  script:
    - echo "Backend build skipped in docker runner"


test_backend:
  stage: test
  script:
    - echo "Add tests later"


docker_build:
  stage: docker_build
  script:
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG frontend/
    - docker build -t $CI_REGISTRY_IMAGE/backend:$IMAGE_TAG backend/


push_images:
  stage: push
  script:
    - docker push $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/backend:$IMAGE_TAG


deploy_dev:
  stage: deploy
  only:
    - dev
  script:
    - echo "Deploying to staging server"


deploy_prod:
  stage: deploy
  only:
    - main
  when: manual
  script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP "
        docker pull $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG &&
        docker pull $CI_REGISTRY_IMAGE/backend:$IMAGE_TAG &&
        cd /carhub &&
        docker compose up -d
      "
  environment:
    name: production
